[project]
name = "emergence-pipeline"
version = "0.1.0"
description = "AI-augmented investment pipeline: topic in, ranked/sourced memos out."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "openai>=1.40",
    "jsonschema>=4.22",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["sourcing/tests", "analysis/tests", "recommendation/tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sourcing", "analysis", "recommendation", "common", "orchestrator"]
